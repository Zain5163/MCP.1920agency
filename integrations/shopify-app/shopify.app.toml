# 1920 Agency Store Connector: lets AdsPilot read a store and, with the owner's
# approval on each change, improve it. Plan: architecture/2026-10-08-shopify-connector-plan.md
# Docs: https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "b92c46823075eae97fd54e2b6e4775eb"
name = "1920 Agency Store Connector"
application_url = "https://mcp.1920agency.com/shopify"
embedded = false

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-10"

[access_scopes]
# Read: products, prices and stock; orders, returns and discounts (real sales vs ads);
# themes, pages and navigation (store audits).
# Write (used only after the owner approves each change): product content, pages,
# navigation, theme files (always on a duplicate theme first), discounts, policies,
# and publishing new products and collections to the Online Store (publications).
# No customer personal data scopes.
scopes = "read_products,read_inventory,read_orders,read_returns,read_discounts,read_themes,read_content,read_online_store_navigation,read_legal_policies,read_publications,write_products,write_content,write_online_store_navigation,write_themes,write_discounts,write_legal_policies,write_publications"

[auth]
redirect_urls = [ "https://mcp.1920agency.com/shopify/callback" ]
